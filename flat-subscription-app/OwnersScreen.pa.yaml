                            Children:
                              - btnFlatSave:
                                  Control: ModernButton
                                  Properties:
                                    Text: =If(varFlatFormMode = "Edit", "Save changes", "Save flat")
                                    AccessibleLabel: ="Save flat"
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =ClrPrimary
                                    DisplayMode: |-
                                      =If(
                                        IsBlank(Trim(txtFlatNo.Text)) ||
                                        !IsBlank(LookUp(colFlats, Lower(Title) = Lower(Trim(txtFlatNo.Text)) && ID <> varFlatEditId)) ||
                                        IsBlank(ddFlatOwner.Selected) ||
                                        Coalesce(numFlatAmount.Value, 0) <= 0,
                                        DisplayMode.Disabled,
                                        DisplayMode.Edit
                                      )
                                    OnSelect: |-
                                      =With(
                                        {
                                          mode: varFlatFormMode,
                                          before: LookUp(colFlats, ID = varFlatEditId),
                                          changes: {
                                            Title: Trim(txtFlatNo.Text),
                                            OwnerID: ddFlatOwner.Selected.ID,
                                            MonthlyAmount: numFlatAmount.Value,
                                            StartDate: dpFlatStart.SelectedDate,
                                            IsActive: tglFlatActive.Checked
                                          }
                                        },
                                        IfError(
                                          Set(
                                            varFlatSaved,
                                            If(
                                              mode = "Edit",
                                              Patch(Flats, LookUp(Flats, ID = varFlatEditId), changes),
                                              Patch(Flats, Defaults(Flats), changes)
                                            )
                                          );
                                          Patch(
                                            AuditLog,
                                            Defaults(AuditLog),
                                            {
                                              Title: If(mode = "Edit", "Update", "Create"),
                                              Entity: "Flat",
                                              RecordID: varFlatSaved.ID,
                                              OldValue: If(
                                                mode = "Edit",
                                                JSON({Flat: before.Title, Owner: OwnerName(before.OwnerID), OwnerID: before.OwnerID, MonthlyAmount: before.MonthlyAmount, StartDate: Text(before.StartDate, "yyyy-mm-dd"), IsActive: before.IsActive}),
                                                ""
                                              ),
                                              NewValue: JSON({Flat: varFlatSaved.Title, Owner: OwnerName(varFlatSaved.OwnerID), OwnerID: varFlatSaved.OwnerID, MonthlyAmount: varFlatSaved.MonthlyAmount, StartDate: Text(varFlatSaved.StartDate, "yyyy-mm-dd"), IsActive: varFlatSaved.IsActive}),
                                              ChangedBy: CurrentUserPerson,
                                              ChangedOn: Now()
                                            }
                                          );
                                          Set(varFlatSnap, {ID: varFlatSaved.ID, FlatNo: varFlatSaved.Title, Owner: OwnerName(varFlatSaved.OwnerID), Amount: varFlatSaved.MonthlyAmount, Start: varFlatSaved.StartDate, Active: varFlatSaved.IsActive});
                                          Set(varFlatLastAction, If(mode = "Edit", "updated", "created"));
                                          ClearCollect(colFlats, Flats);
                                          Set(varOwnSelectedId, varFlatSaved.OwnerID);
                                          Set(varFlatFormMode, ""),
                                          Notify("Could not save flat. " & FirstError.Message, NotificationType.Error)
                                        )
                                      )
