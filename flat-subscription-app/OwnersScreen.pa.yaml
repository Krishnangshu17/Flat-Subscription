                                                Entity: "Flat",
                                                RecordID: before.ID,
                                                OldValue: JSON({Flat: before.Title, Owner: OwnerName(before.OwnerID), OwnerID: before.OwnerID, MonthlyAmount: before.MonthlyAmount, StartDate: Text(before.StartDate, "yyyy-mm-dd"), IsActive: before.IsActive}),
                                                NewValue: "",
                                                ChangedBy: CurrentUserPerson,
                                                ChangedOn: Now()
                                              }
                                            );
                                            Set(varFlatSnap, {ID: before.ID, FlatNo: before.Title, Owner: OwnerName(before.OwnerID), Amount: before.MonthlyAmount, Start: before.StartDate, Active: before.IsActive});
                                            Set(varFlatLastAction, "deleted");
                                            ClearCollect(colFlats, Flats);
                                            Set(varFlatDeleteId, 0),
                                            Notify("Could not delete flat. " & FirstError.Message, NotificationType.Error)
                                          )
                                        )
