                            Control: ModernText
                            Properties:
                              Text: |-
                                =If(
                                  IsBlank(Trim(txtFlatNo.Text)), "Flat number is required.",
                                  !IsBlank(LookUp(colFlats, Lower(Title) = Lower(Trim(txtFlatNo.Text)) && ID <> varFlatEditId)), "Flat number already exists.",
                                  IsBlank(ddFlatOwner.Selected), "Select an owner.",
                                  Coalesce(numFlatAmount.Value, 0) <= 0, "Monthly amount must be more than 0.",
                                  ""
                                )
                              AccessibleLabel: ="Flat validation message"
