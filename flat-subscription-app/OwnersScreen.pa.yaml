                              LayoutAlignItems: =LayoutAlignItems.Center
                              LayoutGap: =8
                              DropShadow: =DropShadow.None
                              Height: =44
                              FillPortions: =0
                              LayoutMinWidth: =0
                              LayoutMinHeight: =0
