Screens:
  OwnersScreen:
    Properties:
      Fill: =ClrBg
      LoadingSpinnerColor: =ClrPrimary
      OnVisible: |-
        =Set(varOwnFormMode, "");
        Set(varOwnDeleteId, 0);
        Set(varFlatFormMode, "");
        Set(varFlatDeleteId, 0);
        Set(varOwnLastAction, "");
        Set(varFlatLastAction, "");
        If(IsBlank(varOwnSelectedId), Set(varOwnSelectedId, 0))
    Children:
      - conOwnRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutGap: =12
            PaddingBottom: =24
            Fill: =ClrBg
            DropShadow: =DropShadow.None
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conOwnTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  Fill: =ClrPrimary
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  PaddingBottom: =8
                  Height: =104
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - conOwnTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - lblOwnAppTitle:
                            Control: ModernText
                            Properties:
                              Text: ="Flat Subscription Tracker"
                              AccessibleLabel: ="Flat Subscription Tracker"
                              Size: =20
                              FontWeight: =FontWeight.Bold
                              Color: =ClrOnPrimary
                              Wrap: =false
                              Height: =40
                              FillPortions: =1
                              LayoutMinWidth: =0
                        - lblOwnRole:
                            Control: ModernText
                            Properties:
                              Text: =If(IsAdmin, "Admin", "View only")
                              AccessibleLabel: =If(IsAdmin, "Signed in as admin", "Signed in with view-only access")
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =ClrOnPrimary
                              Align: =Align.Right
                              Wrap: =false
                              Height: =40
                              Width: =96
                              FillPortions: =0
                              LayoutMinWidth: =0
                  - conOwnNavRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutOverflowX: =LayoutOverflow.Scroll
                        LayoutGap: =6
                        DropShadow: =DropShadow.None
                        Height: =44
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - btnOwnNavHome:
                            Control: ModernButton
                            Properties:
                              Text: ="Dashboard"
                              AccessibleLabel: ="Go to Dashboard"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(Screen1, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnOwnNavOwners:
                            Control: ModernButton
                            Properties:
                              Text: ="Owners & Flats"
                              AccessibleLabel: ="Go to Owners & Flats"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =ClrAccent
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Bold
                              OnSelect: =Navigate(OwnersScreen, ScreenTransition.None)
                              Width: =136
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnOwnNavPayments:
                            Control: ModernButton
                            Properties:
                              Text: ="Payments"
                              AccessibleLabel: ="Go to Payments"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(PaymentsScreen, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnOwnNavReports:
                            Control: ModernButton
                            Properties:
                              Text: ="Reports"
                              AccessibleLabel: ="Go to Reports"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(ReportsScreen, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnOwnNavAudit:
                            Control: ModernButton
                            Properties:
                              Text: ="Audit Log"
                              AccessibleLabel: ="Go to Audit Log"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(AuditScreen, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                              Visible: =IsAdmin
            - conOwnHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  DropShadow: =DropShadow.None
                  Height: =52
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblOwnTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Owners & Flats"
                        AccessibleLabel: ="Owners and flats"
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Color: =ClrText
                        Wrap: =false
                        Height: =44
                        FillPortions: =1
                        LayoutMinWidth: =0
                  - btnOwnAdd:
                      Control: ModernButton
                      Properties:
                        Text: ="+ Add owner"
                        AccessibleLabel: ="Add owner"
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =ClrPrimary
                        Visible: =IsAdmin
                        OnSelect: |-
                          =Set(varOwnEditId, 0);
                          Set(varOwnFormMode, "Add");
                          Set(varOwnDeleteId, 0);
                          Set(varOwnLastAction, "");
                          Reset(txtOwnName);
                          Reset(txtOwnPhone);
                          Reset(txtOwnEmail);
                          Reset(tglOwnActive)
                        Width: =132
                        Height: =44
                        FillPortions: =0
                        LayoutMinWidth: =0
            - conOwnReceipt:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =8
                  Fill: =RGBA(232, 245, 233, 1)
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =8
                  RadiusTopRight: =8
                  RadiusBottomLeft: =8
                  RadiusBottomRight: =8
                  Visible: =varOwnLastAction <> ""
                  Height: =76
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblOwnReceipt:
                      Control: ModernText
                      Properties:
                        Text: |-
                          ="Owner " & varOwnLastAction & " (ID " & varOwnSnap.ID & ")" & Char(10) &
                          "Name: " & varOwnSnap.Name & "  ·  Phone: " & Coalesce(varOwnSnap.Phone, "-") &
                          "  ·  Email: " & Coalesce(varOwnSnap.Email, "-") & "  ·  " & If(varOwnSnap.Active, "Active", "Inactive")
                        AccessibleLabel: ="Owner change confirmation"
                        Size: =13
                        Color: =RGBA(27, 94, 32, 1)
                        Wrap: =true
                        VerticalAlign: =VerticalAlign.Middle
                        Height: =68
                        FillPortions: =1
                        LayoutMinWidth: =0
                  - btnOwnReceiptClose:
                      Control: ModernButton
                      Properties:
                        Text: ="Dismiss"
                        AccessibleLabel: ="Dismiss owner confirmation"
                        Appearance: =ButtonAppearance.Subtle
                        Color: =RGBA(27, 94, 32, 1)
                        OnSelect: =Set(varOwnLastAction, "")
                        Width: =84
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
            - conOwnForm:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  PaddingBottom: =16
                  Fill: =ClrCard
                  DropShadow: =DropShadow.Regular
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  Visible: =IsAdmin && varOwnFormMode <> ""
                  Height: =420
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblOwnFormTitle:
                      Control: ModernText
                      Properties:
                        Text: =If(varOwnFormMode = "Edit", "Edit owner", "Add owner")
                        AccessibleLabel: =If(varOwnFormMode = "Edit", "Edit owner", "Add owner")
                        Size: =18
                        FontWeight: =FontWeight.Bold
                        Color: =ClrPrimary
                        Wrap: =false
                        Height: =32
                        LayoutMinWidth: =0
                  - conOwnFieldName:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =4
                        DropShadow: =DropShadow.None
                        Height: =66
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - lblOwnName:
                            Control: ModernText
                            Properties:
                              Text: ="Owner name *"
                              AccessibleLabel: ="Owner name, required"
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =ClrText
                              Height: =22
                              LayoutMinWidth: =0
                        - txtOwnName:
                            Control: ModernTextInput
                            Properties:
                              Default: =If(varOwnFormMode = "Edit", LookUp(colOwners, ID = varOwnEditId).Title, "")
                              Placeholder: ="Full name"
                              AccessibleLabel: ="Owner name"
                              Appearance: =Appearance.Outline
                              Required: =true
                              ValidationState: =If(IsBlank(Trim(Self.Text)), ValidationState.Error, ValidationState.None)
                              Height: =40
                              LayoutMinWidth: =0
                  - conOwnFieldPhone:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =4
                        DropShadow: =DropShadow.None
                        Height: =66
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - lblOwnPhone:
                            Control: ModernText
                            Properties:
                              Text: ="Phone"
                              AccessibleLabel: ="Phone"
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =ClrText
                              Height: =22
                              LayoutMinWidth: =0
                        - txtOwnPhone:
                            Control: ModernTextInput
                            Properties:
                              Default: =If(varOwnFormMode = "Edit", LookUp(colOwners, ID = varOwnEditId).Phone, "")
                              Placeholder: ="Mobile number"
                              AccessibleLabel: ="Phone"
                              Appearance: =Appearance.Outline
                              Height: =40
                              LayoutMinWidth: =0
                  - conOwnFieldEmail:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =4
                        DropShadow: =DropShadow.None
                        Height: =66
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - lblOwnEmail:
                            Control: ModernText
                            Properties:
                              Text: ="Email"
                              AccessibleLabel: ="Email"
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =ClrText
                              Height: =22
                              LayoutMinWidth: =0
                        - txtOwnEmail:
                            Control: ModernTextInput
                            Properties:
                              Default: =If(varOwnFormMode = "Edit", LookUp(colOwners, ID = varOwnEditId).Email, "")
                              Placeholder: ="name@example.com"
                              AccessibleLabel: ="Email"
                              Appearance: =Appearance.Outline
                              Height: =40
                              LayoutMinWidth: =0
                  - tglOwnActive:
                      Control: ModernToggle
                      Properties:
                        Label: ="Active owner"
                        AccessibleLabel: ="Active owner"
                        Default: =If(varOwnFormMode = "Edit", LookUp(colOwners, ID = varOwnEditId).IsActive, true)
                        Height: =40
                        Width: =200
                        AlignInContainer: =AlignInContainer.Start
                        LayoutMinWidth: =0
                  - lblOwnValidation:
                      Control: ModernText
                      Properties:
                        Text: ="Owner name is required."
                        AccessibleLabel: ="Owner name is required"
                        Size: =12
                        Color: =ClrDue
                        Visible: =IsBlank(Trim(txtOwnName.Text))
                        Height: =22
                        LayoutMinWidth: =0
                  - conOwnFormButtons:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Height: =44
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - btnOwnSave:
                            Control: ModernButton
                            Properties:
                              Text: =If(varOwnFormMode = "Edit", "Save changes", "Save owner")
                              AccessibleLabel: ="Save owner"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =ClrPrimary
                              DisplayMode: =If(IsBlank(Trim(txtOwnName.Text)), DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: |-
                                =With(
                                  {
                                    mode: varOwnFormMode,
                                    before: LookUp(colOwners, ID = varOwnEditId),
                                    changes: {
                                      Title: Trim(txtOwnName.Text),
                                      Phone: Trim(txtOwnPhone.Text),
                                      Email: Trim(txtOwnEmail.Text),
                                      IsActive: tglOwnActive.Checked
                                    }
                                  },
                                  IfError(
                                    Set(
                                      varOwnSaved,
                                      If(
                                        mode = "Edit",
                                        Patch(Owners, LookUp(Owners, ID = varOwnEditId), changes),
                                        Patch(Owners, Defaults(Owners), changes)
                                      )
                                    );
                                    Patch(
                                      AuditLog,
                                      Defaults(AuditLog),
                                      {
                                        Title: If(mode = "Edit", "Update", "Create"),
                                        Entity: "Owner",
                                        RecordID: varOwnSaved.ID,
                                        OldValue: If(mode = "Edit", JSON({Name: before.Title, Phone: before.Phone, Email: before.Email, IsActive: before.IsActive}), ""),
                                        NewValue: JSON({Name: varOwnSaved.Title, Phone: varOwnSaved.Phone, Email: varOwnSaved.Email, IsActive: varOwnSaved.IsActive}),
                                        ChangedBy: CurrentUserPerson,
                                        ChangedOn: Now()
                                      }
                                    );
                                    Set(varOwnSnap, {ID: varOwnSaved.ID, Name: varOwnSaved.Title, Phone: varOwnSaved.Phone, Email: varOwnSaved.Email, Active: varOwnSaved.IsActive});
                                    Set(varOwnLastAction, If(mode = "Edit", "updated", "created"));
                                    ClearCollect(colOwners, Owners);
                                    Set(varOwnSelectedId, varOwnSaved.ID);
                                    Set(varOwnFormMode, ""),
                                    Notify("Could not save owner. " & FirstError.Message, NotificationType.Error)
                                  )
                                )
                              Width: =140
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnOwnCancel:
                            Control: ModernButton
                            Properties:
                              Text: ="Cancel"
                              AccessibleLabel: ="Cancel owner edit"
                              Appearance: =ButtonAppearance.Outline
                              Color: =ClrText
                              OnSelect: =Set(varOwnFormMode, "")
                              Width: =96
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
            - conOwnDelete:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =12
                  PaddingBottom: =12
                  Fill: =RGBA(253, 236, 234, 1)
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =10
                  RadiusTopRight: =10
                  RadiusBottomLeft: =10
                  RadiusBottomRight: =10
                  Visible: =IsAdmin && varOwnDeleteId > 0
                  Height: =128
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblOwnDeleteMsg:
                      Control: ModernText
                      Properties:
                        Text: |-
                          =If(
                            CountRows(Filter(colFlats, OwnerID = varOwnDeleteId)) > 0,
                            "Owner '" & OwnerName(varOwnDeleteId) & "' still has " & CountRows(Filter(colFlats, OwnerID = varOwnDeleteId)) & " flat(s). Delete or reassign the flats first.",
                            "Delete owner '" & OwnerName(varOwnDeleteId) & "'? This cannot be undone."
                          )
                        AccessibleLabel: ="Delete owner confirmation"
                        Size: =14
                        Color: =RGBA(140, 20, 20, 1)
                        Wrap: =true
                        Height: =52
                        LayoutMinWidth: =0
                  - conOwnDeleteButtons:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Height: =44
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - btnOwnDeleteConfirm:
                            Control: ModernButton
                            Properties:
                              Text: ="Delete owner"
                              AccessibleLabel: ="Confirm delete owner"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =ClrDue
                              DisplayMode: =If(CountRows(Filter(colFlats, OwnerID = varOwnDeleteId)) > 0, DisplayMode.Disabled, DisplayMode.Edit)
                              OnSelect: |-
                                =With(
                                  {delId: varOwnDeleteId, before: LookUp(colOwners, ID = varOwnDeleteId)},
                                  If(
                                    CountRows(Filter(colFlats, OwnerID = before.ID)) = 0,
                                    IfError(
                                      Remove(Owners, LookUp(Owners, ID = delId));
                                      Patch(
                                        AuditLog,
                                        Defaults(AuditLog),
                                        {
                                          Title: "Delete",
                                          Entity: "Owner",
                                          RecordID: before.ID,
                                          OldValue: JSON({Name: before.Title, Phone: before.Phone, Email: before.Email, IsActive: before.IsActive}),
                                          NewValue: "",
                                          ChangedBy: CurrentUserPerson,
                                          ChangedOn: Now()
                                        }
                                      );
                                      Set(varOwnSnap, {ID: before.ID, Name: before.Title, Phone: before.Phone, Email: before.Email, Active: before.IsActive});
                                      Set(varOwnLastAction, "deleted");
                                      If(varOwnSelectedId = before.ID, Set(varOwnSelectedId, 0));
                                      ClearCollect(colOwners, Owners);
                                      Set(varOwnDeleteId, 0),
                                      Notify("Could not delete owner. " & FirstError.Message, NotificationType.Error)
                                    )
                                  )
                                )
                              Width: =132
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnOwnDeleteCancel:
                            Control: ModernButton
                            Properties:
                              Text: ="Cancel"
                              AccessibleLabel: ="Cancel delete owner"
                              Appearance: =ButtonAppearance.Outline
                              Color: =ClrText
                              OnSelect: =Set(varOwnDeleteId, 0)
                              Width: =96
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
            - conOwnSearch:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  PaddingLeft: =16
                  PaddingRight: =16
                  DropShadow: =DropShadow.None
                  Height: =66
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblOwnSearch:
                      Control: ModernText
                      Properties:
                        Text: ="Search owners (name, phone or email)"
                        AccessibleLabel: ="Search owners"
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Color: =ClrText
                        Height: =22
                        LayoutMinWidth: =0
                  - txtOwnSearch:
                      Control: ModernTextInput
                      Properties:
                        Placeholder: ="Type to filter"
                        AccessibleLabel: ="Search owners"
                        Appearance: =Appearance.Outline
                        Type: =TextInputType.Search
                        Height: =40
                        LayoutMinWidth: =0
            - lblOwnEmpty:
                Control: ModernText
                Properties:
                  Text: =If(CountRows(colOwners) = 0, "No owners yet." & If(IsAdmin, " Use '+ Add owner' to create one.", ""), "No owners match your search.")
                  AccessibleLabel: ="No owners to show"
                  Size: =14
                  Color: =ClrMuted
                  PaddingLeft: =16
                  Visible: =CountRows(Filter(colOwners, IsBlank(Trim(txtOwnSearch.Text)) || Trim(txtOwnSearch.Text) in Title || Trim(txtOwnSearch.Text) in Phone || Trim(txtOwnSearch.Text) in Email)) = 0
                  Height: =32
                  FillPortions: =0
                  LayoutMinWidth: =0
            - conOwnListWrap:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingLeft: =10
                  PaddingRight: =10
                  DropShadow: =DropShadow.None
                  Height: =392
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - galOwnList:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =SortByColumns(
                            Filter(
                              colOwners,
                              IsBlank(Trim(txtOwnSearch.Text)) ||
                              Trim(txtOwnSearch.Text) in Title ||
                              Trim(txtOwnSearch.Text) in Phone ||
                              Trim(txtOwnSearch.Text) in Email
                            ),
                            "Title",
                            SortOrder.Ascending
                          )
                        TemplateSize: =124
                        TemplatePadding: =6
                        Selectable: =false
                        BorderThickness: =0
                        AccessibleLabel: ="Owners list"
                        TabIndex: =0
                        FillPortions: =1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - conOwnRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =2
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =10
                              PaddingBottom: =10
                              Fill: =If(ThisItem.ID = varOwnSelectedId, RGBA(224, 242, 241, 1), ClrCard)
                              BorderColor: =ClrAccent
                              BorderThickness: =If(ThisItem.ID = varOwnSelectedId, 2, 0)
                              DropShadow: =DropShadow.Light
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                            Children:
                              - lblOwnRowName:
                                  Control: ModernText
                                  Properties:
                                    Text: =ThisItem.Title & If(ThisItem.IsActive, "", "  (inactive)")
                                    AccessibleLabel: ="Owner " & ThisItem.Title
                                    Size: =16
                                    FontWeight: =FontWeight.Bold
                                    Color: =ClrText
                                    Wrap: =false
                                    Height: =26
                                    LayoutMinWidth: =0
                              - lblOwnRowDetails:
                                  Control: ModernText
                                  Properties:
                                    Text: |-
                                      =Coalesce(ThisItem.Phone, "No phone") & "  ·  " & Coalesce(ThisItem.Email, "No email") & "  ·  " &
                                      CountRows(Filter(colFlats, OwnerID = ThisItem.ID)) & " flat(s), " &
                                      Money(Sum(Filter(colFlats, OwnerID = ThisItem.ID && IsActive), MonthlyAmount)) & "/month"
                                    AccessibleLabel: ="Owner details"
                                    Size: =13
                                    Color: =ClrMuted
                                    Wrap: =false
                                    Height: =24
                                    LayoutMinWidth: =0
                              - conOwnRowActions:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    PaddingTop: =4
                                    DropShadow: =DropShadow.None
                                    Height: =44
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                  Children:
                                    - btnOwnRowFlats:
                                        Control: ModernButton
                                        Properties:
                                          Text: ="View flats"
                                          AccessibleLabel: ="View flats of " & ThisItem.Title
                                          Appearance: =If(ThisItem.ID = varOwnSelectedId, ButtonAppearance.Primary, ButtonAppearance.Outline)
                                          BasePaletteColor: =ClrPrimary
