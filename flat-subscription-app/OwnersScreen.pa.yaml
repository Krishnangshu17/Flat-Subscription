                                    AccessibleLabel: ="Confirm delete flat"
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =ClrDue
                                    DisplayMode: =If(!IsBlank(LookUp(Payments, FlatID = varFlatDeleteId)), DisplayMode.Disabled, DisplayMode.Edit)
                                    OnSelect: |-
                                      =With(
                                        {delId: varFlatDeleteId, before: LookUp(colFlats, ID = varFlatDeleteId)},
                                        If(
                                          IsBlank(LookUp(Payments, FlatID = delId)),
                                          IfError(
                                            Remove(Flats, LookUp(Flats, ID = delId));
                                            Patch(
                                              AuditLog,
                                              Defaults(AuditLog),
                                              {
