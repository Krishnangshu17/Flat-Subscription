Screens:
  AuditScreen:
    Properties:
      Fill: =ClrBg
      LoadingSpinnerColor: =ClrPrimary
      OnVisible: |-
        =Set(varAudEntity, "All");
        Set(varAudAction, "All");
        Refresh(AuditLog)
    Children:
      - conAudRoot:
          Control: GroupContainer
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutOverflowY: =LayoutOverflow.Scroll
            LayoutGap: =12
            PaddingBottom: =24
            Fill: =ClrBg
            DropShadow: =DropShadow.None
            RadiusTopLeft: =0
            RadiusTopRight: =0
            RadiusBottomLeft: =0
            RadiusBottomRight: =0
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conAudTopBar:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =4
                  Fill: =ClrPrimary
                  DropShadow: =DropShadow.None
                  RadiusTopLeft: =0
                  RadiusTopRight: =0
                  RadiusBottomLeft: =0
                  RadiusBottomRight: =0
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =8
                  PaddingBottom: =8
                  Height: =104
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - conAudTitleRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutGap: =8
                        DropShadow: =DropShadow.None
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - lblAudAppTitle:
                            Control: ModernText
                            Properties:
                              Text: ="Flat Subscription Tracker"
                              AccessibleLabel: ="Flat Subscription Tracker"
                              Size: =20
                              FontWeight: =FontWeight.Bold
                              Color: =ClrOnPrimary
                              Wrap: =false
                              Height: =40
                              FillPortions: =1
                              LayoutMinWidth: =0
                        - lblAudRole:
                            Control: ModernText
                            Properties:
                              Text: =If(IsAdmin, "Admin", "View only")
                              AccessibleLabel: =If(IsAdmin, "Signed in as admin", "Signed in with view-only access")
                              Size: =13
                              FontWeight: =FontWeight.Semibold
                              Color: =ClrOnPrimary
                              Align: =Align.Right
                              Wrap: =false
                              Height: =40
                              Width: =96
                              FillPortions: =0
                              LayoutMinWidth: =0
                  - conAudNavRow:
                      Control: GroupContainer
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Center
                        LayoutOverflowX: =LayoutOverflow.Scroll
                        LayoutGap: =6
                        DropShadow: =DropShadow.None
                        Height: =44
                        FillPortions: =0
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - btnAudNavHome:
                            Control: ModernButton
                            Properties:
                              Text: ="Dashboard"
                              AccessibleLabel: ="Go to Dashboard"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(Screen1, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnAudNavOwners:
                            Control: ModernButton
                            Properties:
                              Text: ="Owners & Flats"
                              AccessibleLabel: ="Go to Owners & Flats"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(OwnersScreen, ScreenTransition.None)
                              Width: =136
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnAudNavPayments:
                            Control: ModernButton
                            Properties:
                              Text: ="Payments"
                              AccessibleLabel: ="Go to Payments"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(PaymentsScreen, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnAudNavReports:
                            Control: ModernButton
                            Properties:
                              Text: ="Reports"
                              AccessibleLabel: ="Go to Reports"
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =ClrPrimary
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Semibold
                              OnSelect: =Navigate(ReportsScreen, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                        - btnAudNavAudit:
                            Control: ModernButton
                            Properties:
                              Text: ="Audit Log"
                              AccessibleLabel: ="Go to Audit Log"
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =ClrAccent
                              Color: =ClrOnPrimary
                              FontWeight: =FontWeight.Bold
                              OnSelect: =Navigate(AuditScreen, ScreenTransition.None)
                              Width: =112
                              Height: =40
                              FillPortions: =0
                              LayoutMinWidth: =0
                              Visible: =IsAdmin
            - conAudHeader:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  DropShadow: =DropShadow.None
                  Height: =52
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblAudTitle:
                      Control: ModernText
                      Properties:
                        Text: ="Audit Log"
                        AccessibleLabel: ="Audit log"
                        Size: =24
                        FontWeight: =FontWeight.Bold
                        Color: =ClrText
                        Wrap: =false
                        Height: =44
                        FillPortions: =1
                        LayoutMinWidth: =0
                  - btnAudRefresh:
                      Control: ModernButton
                      Properties:
                        Text: ="Refresh"
                        AccessibleLabel: ="Refresh audit log"
                        Appearance: =ButtonAppearance.Outline
                        Color: =ClrPrimary
                        Visible: =IsAdmin
                        OnSelect: =Refresh(AuditLog)
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
            - lblAudNoAccess:
                Control: ModernText
                Properties:
                  Text: ="The audit log is available to the admin only."
                  AccessibleLabel: ="The audit log is available to the admin only"
                  Size: =15
                  Color: =ClrDue
                  PaddingLeft: =16
                  Visible: =!IsAdmin
                  Height: =36
                  FillPortions: =0
                  LayoutMinWidth: =0
            - conAudEntityFilter:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutWrap: =true
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  DropShadow: =DropShadow.None
                  Visible: =IsAdmin
                  Height: =If(App.Width < 480, 92, 44)
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblAudEntity:
                      Control: ModernText
                      Properties:
                        Text: ="Record type"
                        AccessibleLabel: ="Record type filter"
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Color: =ClrText
                        Wrap: =false
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudEntAll:
                      Control: ModernButton
                      Properties:
                        Text: ="All"
                        AccessibleLabel: ="All record types"
                        Appearance: =If(varAudEntity = "All", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPrimary
                        Color: =If(varAudEntity = "All", ClrOnPrimary, ClrPrimary)
                        OnSelect: =Set(varAudEntity, "All")
                        Width: =64
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudEntOwner:
                      Control: ModernButton
                      Properties:
                        Text: ="Owner"
                        AccessibleLabel: ="Owner records"
                        Appearance: =If(varAudEntity = "Owner", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPrimary
                        Color: =If(varAudEntity = "Owner", ClrOnPrimary, ClrPrimary)
                        OnSelect: =Set(varAudEntity, "Owner")
                        Width: =80
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudEntFlat:
                      Control: ModernButton
                      Properties:
                        Text: ="Flat"
                        AccessibleLabel: ="Flat records"
                        Appearance: =If(varAudEntity = "Flat", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPrimary
                        Color: =If(varAudEntity = "Flat", ClrOnPrimary, ClrPrimary)
                        OnSelect: =Set(varAudEntity, "Flat")
                        Width: =68
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudEntPayment:
                      Control: ModernButton
                      Properties:
                        Text: ="Payment"
                        AccessibleLabel: ="Payment records"
                        Appearance: =If(varAudEntity = "Payment", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPrimary
                        Color: =If(varAudEntity = "Payment", ClrOnPrimary, ClrPrimary)
                        OnSelect: =Set(varAudEntity, "Payment")
                        Width: =92
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
            - conAudActionFilter:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutWrap: =true
                  LayoutGap: =8
                  PaddingLeft: =16
                  PaddingRight: =16
                  DropShadow: =DropShadow.None
                  Visible: =IsAdmin
                  Height: =If(App.Width < 480, 92, 44)
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - lblAudAction:
                      Control: ModernText
                      Properties:
                        Text: ="Action"
                        AccessibleLabel: ="Action filter"
                        Size: =13
                        FontWeight: =FontWeight.Semibold
                        Color: =ClrText
                        Wrap: =false
                        Width: =96
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudActAll:
                      Control: ModernButton
                      Properties:
                        Text: ="All"
                        AccessibleLabel: ="All actions"
                        Appearance: =If(varAudAction = "All", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPrimary
                        Color: =If(varAudAction = "All", ClrOnPrimary, ClrPrimary)
                        OnSelect: =Set(varAudAction, "All")
                        Width: =64
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudActCreate:
                      Control: ModernButton
                      Properties:
                        Text: ="Create"
                        AccessibleLabel: ="Create actions"
                        Appearance: =If(varAudAction = "Create", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPaid
                        Color: =If(varAudAction = "Create", ClrOnPrimary, ClrPaid)
                        OnSelect: =Set(varAudAction, "Create")
                        Width: =84
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudActUpdate:
                      Control: ModernButton
                      Properties:
                        Text: ="Update"
                        AccessibleLabel: ="Update actions"
                        Appearance: =If(varAudAction = "Update", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrPartial
                        Color: =If(varAudAction = "Update", ClrOnPrimary, ClrPartial)
                        OnSelect: =Set(varAudAction, "Update")
                        Width: =84
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
                  - btnAudActDelete:
                      Control: ModernButton
                      Properties:
                        Text: ="Delete"
                        AccessibleLabel: ="Delete actions"
                        Appearance: =If(varAudAction = "Delete", ButtonAppearance.Primary, ButtonAppearance.Outline)
                        BasePaletteColor: =ClrDue
                        Color: =If(varAudAction = "Delete", ClrOnPrimary, ClrDue)
                        OnSelect: =Set(varAudAction, "Delete")
                        Width: =84
                        Height: =40
                        FillPortions: =0
                        LayoutMinWidth: =0
            - conAudListWrap:
                Control: GroupContainer
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  PaddingLeft: =10
                  PaddingRight: =10
                  DropShadow: =DropShadow.None
                  Visible: =IsAdmin
                  Height: =620
                  FillPortions: =0
                  LayoutMinWidth: =0
                  LayoutMinHeight: =0
                Children:
                  - galAudList:
                      Control: Gallery
                      Variant: Vertical
                      Properties:
                        Items: |-
                          =Sort(
                            Filter(
                              AuditLog,
                              (varAudEntity = "All" || Entity = varAudEntity) &&
                              (varAudAction = "All" || Title = varAudAction)
                            ),
                            ChangedOn,
                            SortOrder.Descending
                          )
                        TemplateSize: =164
                        TemplatePadding: =6
                        Selectable: =false
                        BorderThickness: =0
                        AccessibleLabel: ="Audit entries, newest first"
                        TabIndex: =0
                        FillPortions: =1
                        LayoutMinWidth: =0
                        LayoutMinHeight: =0
                      Children:
                        - conAudRow:
                            Control: GroupContainer
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =2
                              PaddingLeft: =14
                              PaddingRight: =14
                              PaddingTop: =8
                              PaddingBottom: =8
                              Fill: =ClrCard
                              DropShadow: =DropShadow.Light
                              RadiusTopLeft: =10
                              RadiusTopRight: =10
                              RadiusBottomLeft: =10
                              RadiusBottomRight: =10
                              X: =0
                              Y: =0
                              Width: =Parent.TemplateWidth
                              Height: =Parent.TemplateHeight
                            Children:
                              - conAudRowHead:
                                  Control: GroupContainer
                                  Variant: AutoLayout
                                  Properties:
                                    LayoutDirection: =LayoutDirection.Horizontal
                                    LayoutAlignItems: =LayoutAlignItems.Center
                                    LayoutGap: =8
                                    DropShadow: =DropShadow.None
                                    Height: =28
                                    FillPortions: =0
                                    LayoutMinWidth: =0
                                    LayoutMinHeight: =0
                                  Children:
                                    - bdgAudRowAction:
                                        Control: Badge
                                        Properties:
                                          Content: =ThisItem.Title
                                          AccessibleLabel: ="Action " & ThisItem.Title
                                          Appearance: ='BadgeCanvas.Appearance'.Tint
                                          Shape: ='BadgeCanvas.Shape'.Rounded
                                          ThemeColor: |-
                                            =Switch(
                                              ThisItem.Title,
                                              "Create", 'BadgeCanvas.ThemeColor'.Success,
                                              "Update", 'BadgeCanvas.ThemeColor'.Warning,
                                              "Delete", 'BadgeCanvas.ThemeColor'.Danger,
                                              'BadgeCanvas.ThemeColor'.Informative
                                            )
                                          Width: =72
                                          Height: =24
                                          FillPortions: =0
                                          LayoutMinWidth: =0
                                    - lblAudRowEntity:
                                        Control: ModernText
                                        Properties:
                                          Text: '=ThisItem.Entity & " #" & ThisItem.RecordID'
                                          AccessibleLabel: =ThisItem.Entity & " record " & ThisItem.RecordID
                                          Size: =15
                                          FontWeight: =FontWeight.Bold
                                          Color: =ClrText
                                          Wrap: =false
                                          Height: =28
                                          FillPortions: =1
                                          LayoutMinWidth: =0
                              - lblAudRowWho:
                                  Control: ModernText
                                  Properties:
                                    Text: |-
                                      =Coalesce(ThisItem.ChangedBy.DisplayName, ThisItem.Author.DisplayName) & "  ·  " &
                                      Text(Coalesce(ThisItem.ChangedOn, ThisItem.Created), "dd mmm yyyy hh:mm")
                                    AccessibleLabel: ="Changed by and when"
                                    Size: =12
                                    Color: =ClrMuted
                                    Wrap: =false
                                    Height: =22
                                    LayoutMinWidth: =0
                              - lblAudRowOld:
                                  Control: ModernText
                                  Properties:
                                    Text: '="Before: " & If(IsBlank(ThisItem.OldValue), "—", ThisItem.OldValue)'
                                    AccessibleLabel: ="Value before change"
                                    Size: =12
                                    Color: =RGBA(140, 20, 20, 1)
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    Height: =40
                                    LayoutMinWidth: =0
                              - lblAudRowNew:
                                  Control: ModernText
                                  Properties:
                                    Text: '="After: " & If(IsBlank(ThisItem.NewValue), "—", ThisItem.NewValue)'
                                    AccessibleLabel: ="Value after change"
                                    Size: =12
                                    Color: =RGBA(27, 94, 32, 1)
                                    Wrap: =true
                                    VerticalAlign: =VerticalAlign.Top
                                    PaddingTop: =0
                                    PaddingBottom: =0
                                    Height: =40
                                    LayoutMinWidth: =0
